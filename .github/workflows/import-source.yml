name: Import latest Clipora source
on:
  push:
    paths: ['.github/workflows/import-source.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify and install the prepared source
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, zipfile
          archive=Path('clipora-latest.zip')
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == 'bbee0c679a3dce6fda20693429d66cc8f9fc0ca9e173f61bb34ba725df74f369'
          root=Path.cwd().resolve()
          with zipfile.ZipFile(archive) as z:
              for info in z.infolist():
                  rel=Path(info.filename)
                  assert not rel.is_absolute() and '..' not in rel.parts
                  if rel.parts[0] == '.github': continue
                  assert rel.parts[0] != '.git' and rel.name != '.env'
                  target=(root/rel).resolve()
                  assert root in target.parents
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(z.read(info))
          archive.unlink()
          PY
      - name: Commit the application source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add latest Clipora app, logo, caption packs and demo fixes"
          git push origin HEAD:main
